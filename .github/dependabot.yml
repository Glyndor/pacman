version: 2

updates:
  # Two ecosystems, the two this repository really has. The GitHub Actions its workflows use,
  # every one pinned by SHA, and the Arch Linux image the packages are built and checked in,
  # pinned by digest in scripts/assemble/Dockerfile (nothing is built from that file: it is
  # where Dependabot reads the image). The packages and the repository metadata are built by
  # scripts and carry no manifest of their own, so there is no pip, npm or cargo entry to add
  # until a file of that kind exists.
  #
  # In each, patch and minor releases arrive together in one pull request and a major one in
  # its own, so a change of major version is read on its own and never rides along with a
  # routine bump. A new digest of the image is a pull request like any other: the whole suite
  # runs against it before it merges.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    # Dependabot infers a prefix from the commit history when this is absent, and
    # the inference has been unstable across repositories. Set it so the title is
    # predictable and matches apt, homebrew-tap and scoop-bucket.
    commit-message:
      prefix: chore

  - package-ecosystem: "docker"
    directory: "/scripts/assemble"
    schedule:
      interval: "daily"
    labels: ["type:deps", "type:ci"]
    open-pull-requests-limit: 5
    groups:
      images-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      images-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: chore
