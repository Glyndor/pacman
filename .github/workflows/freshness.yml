name: Freshness

# Watchers for things whose failure mode is silence.
#
# A cron that stops firing emits nothing, and "no alert" is indistinguishable from "all clear". Every scheduled workflow in this
# organisation went dark on 2026-06-29 and four repositories stayed dark for another four weeks, all reporting `active` throughout.
# These turn the ABSENCE of a scheduled run into a red check on ordinary work, which is the only place anyone would see it.
#
# Separate from the suite on purpose: these fail because something did not happen elsewhere, never because a pull request is wrong,
# and none of them may become a required check, since a red one says nothing about the change under review.
#
# Every scheduled workflow of this repository has a watcher here, and scheduled-workflows-are-watched.test.sh says so for the next
# one that is added. The limit of a daily or weekly cron is two periods plus one day (three days, fifteen), the rule that
# reusable-schedule-freshness.yml states for its max-age-days input; a cron that fires more than once a day keeps a limit of its own.
#
# The watcher is on pull request (only when it changes what these jobs are made of), on push to main and on a cron of its own,
# because a watcher that fires only on a cron shares the failure mode it exists to catch.

on:
  # Twice a day rather than daily: a single dropped firing would put a daily check past its own limit before it ran. At 08:13 and
  # 20:13 and not on the hour, which GitHub queues for everybody at once.
  schedule:
    - cron: "13 8,20 * * *"
  pull_request:
    paths:
      - .github/workflows/freshness.yml
      - .github/workflows/reusable-dependabot-freshness.yml
      - .github/workflows/reusable-schedule-freshness.yml
      - .github/workflows/reusable-shell-ci.yml
      - .github/workflows/reusable-workflow-lint.yml
      - .github/dependabot.yml
      - scripts/monitoring/check-tool-versions.sh
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: freshness-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # codeql.yml runs the analysis of the workflows and of the Python every Monday, besides each pull request and each push to main. The
  # cron is the only thing that catches a query added to the suite since, so a cron that stops takes that with it and nothing says so.
  # Fifteen days, by the rule above for a weekly cron. A workflow with no scheduled run on record gets the same fifteen days from the
  # commit that added its file as a grace period (a notice, not a failure), so this watcher is not born red.
  freshness-codeql:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: codeql.yml
      max-age-days: 15

  # The watcher watches itself, and this is the last link: it has a cron, and nothing else watches whether that cron keeps firing.
  # Two days, because the cron runs twice a day and GitHub starts it hours late, which is ordinary. count-any-conclusion, because this
  # job watches the workflow it is part of: with the success-only query one stretch without a successful scheduled run would make it
  # fail every run after that, and a failed run never becomes the success the next query looks for.
  freshness-itself:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: freshness.yml
      max-age-days: 2
      count-any-conclusion: true

  # Dependabot is not a workflow: it is an integration with its own schedule, and a silent Dependabot emits nothing. The newest
  # pull request it opened is the last time it spoke, and when that is old and some pin of the workflows or of the requirements is
  # behind, the silence is the alert it never sent. Fifteen days, well above one missed run of a daily Dependabot: it opens a
  # pull request only when there is an upstream update, so a healthy but idle Dependabot is expected to be quiet for stretches.
  # The watcher reads the pull requests of this repository and the pins of the workflows and of the requirements the dependabot.yml
  # hands to the pip ecosystem, so the pull request that changes what it looks at is the one that runs it.
  dependabot-freshness:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15

  # shellcheck and actionlint decide a required check, and each is pinned by version and sha256 inside a reusable workflow. Dependabot
  # moves `uses:` pins and nothing else, so a version written as a value had no update path: a frozen linter stays green while the
  # releases after it fix bugs and learn new checks, and nothing says so. The script compares the pins with the newest release of
  # koalaman/shellcheck and rhysd/actionlint and fails when a newer one has been out for more than thirty days. It reads two public
  # repositories with the job's own token, so `contents: read` is all it needs. Neither it nor the suite installs anything: the script
  # imports yaml, which the runner image ships.
  tool-versions:
    name: pinned tool versions keep up with upstream
    # ubuntu-latest on purpose: this job only asks GitHub or git for data and compares strings, so a new image cannot change its
    # verdict.
    runs-on: ubuntu-latest
    # Two `gh release list` calls and a checkout: seconds. Ten minutes is the floor of this repository for a job whose honest run is
    # seconds.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the pinned tool versions with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash ./scripts/monitoring/check-tool-versions.sh
